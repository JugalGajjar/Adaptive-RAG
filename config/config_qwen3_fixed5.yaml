defaults:
  - _self_
  - override hydra/job_logging: default
  - override hydra/hydra_logging: default

# Experiment: Qwen3 4B - Fixed-5 RAG (Aggressive Baseline)
experiment_name: "qwen3-4b-fixed-5"
model_size: "4B"
strategy: "fixed"
fixed_retrieval_count: 5  # FIXED: Always retrieve 5 documents

# Data Configuration
data:
  data_path: "data/"
  corpus_path: "data/corpus/"
  train_path: "data/train.jsonl"
  val_path: "data/val.jsonl"
  test_path: "data/test.jsonl"
  use_embeddings_for_difficulty: true
  difficulty_levels: ["simple", "medium", "hard"]

# Model Configuration
model:
  generator:
    type: "huggingface"
    name: "Qwen/Qwen3-4B-Instruct-2507"
    device: "cuda"
    max_tokens: 512
    temperature: 0.1
    torch_dtype: "float16"
    load_in_8bit: false
    load_in_4bit: false
  
  retriever:
    type: "dense"
    embedding_model: "all-MiniLM-L6-v2"
    top_k_initial: 5  # Always retrieve 5
    retrieval_embeddings_path: "data/embeddings/"

# Fixed RAG Configuration
fixed_rag:
  enabled: true
  retrieval_strategy: "fixed"
  fixed_retrieval_count: 5  # ALWAYS 5 retrievals

# Evaluation Configuration (NO TRAINING for baseline)
evaluation:
  checkpoint_path: null
  output_dir: "results/qwen3-4b-fixed-5/"
  max_samples: 10000
  num_val_samples: 500
  metrics: ["accuracy", "retrieval_count", "latency", "energy_estimate"]

# WandB Configuration
wandb:
  enabled: true
  project: "adaptive-rag-opensource"
  name: "qwen3-4b-fixed-5-baseline"
  tags: ["4b", "qwen", "fixed-5", "baseline"]