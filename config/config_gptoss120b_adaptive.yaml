defaults:
  - _self_
  - override hydra/job_logging: default
  - override hydra/hydra_logging: default

# Experiment: GPT-OSS 120B - Adaptive (Groq API)
experiment_name: "gpt-oss-120b-adaptive"
model_size: "120B"
strategy: "adaptive"

# Data Configuration
data:
  data_path: "data/"
  corpus_path: "data/corpus/"
  train_path: "data/train.jsonl"
  val_path: "data/val.jsonl"
  test_path: "data/test.jsonl"
  use_embeddings_for_difficulty: true
  difficulty_levels: ["simple", "medium", "hard"]

# Model Configuration
model:
  generator:
    type: "groq"  # Groq API
    name: "openai/gpt-oss-120b"  # 120B
    api_key: "${GROQ_API_KEY}"
    max_tokens: 512
    temperature: 0.1
    # Rate limiting (free tier)
    requests_per_minute: 25  # Stay under 30 limit
    max_retries: 3
    retry_on_rate_limit: true
  
  retriever:
    type: "dense"
    embedding_model: "all-MiniLM-L6-v2"
    top_k_initial: 3
    retrieval_embeddings_path: "data/embeddings/"
  
  policy_network:
    hidden_size: 256
    num_layers: 2
    dropout: 0.1
    use_attention: true

# Training Configuration (adjusted for API rate limits)
training:
  seed: 42
  batch_size: 16  # Smaller due to API
  learning_rate: 1e-4
  gamma: 0.99
  tau: 0.005
  buffer_size: 50000
  warmup_steps: 1000
  
  total_episodes: 2000  # Fewer due to API rate limits
  episodes_per_epoch: 5
  updates_per_epoch: 5
  eval_interval: 100
  checkpoint_interval: 250
  checkpoint_dir: "checkpoints/gpt-oss-120b-adaptive/"
  
  reward_weights:
    correctness: 5.0
    retrieval_penalty: -0.1
    latency_penalty: -0.01
    step_penalty: -0.05
    retrieval_quality: 2.0

# Environment Configuration
environment:
  max_retrieval_steps: 5
  confidence_threshold: 0.7
  max_query_reformulations: 2
  early_stopping_patience: 3
  retrieval_batch_size: 3

# Evaluation Configuration
evaluation:
  checkpoint_path: "checkpoints/gpt-oss-120b-adaptive/best_model.pt"
  output_dir: "results/gpt-oss-120b-adaptive/"
  max_samples: 5000  # Fewer due to API
  num_val_samples: 200
  metrics: ["accuracy", "retrieval_count", "latency", "energy_estimate"]

# WandB Configuration
wandb:
  enabled: true
  project: "adaptive-rag-opensource"
  name: "gpt-oss-120b-adaptive-groq"
  tags: ["120b", "gpt-oss", "adaptive", "groq-api"]