defaults:
  - _self_
  - override hydra/job_logging: default
  - override hydra/hydra_logging: default

# Experiment: Phi-3.5 - Fixed-1 RAG
experiment_name: "phi3.5-fixed-1"
model_size: "3.8B"
strategy: "fixed"
fixed_retrieval_count: 1

# Data Configuration
data:
  data_path: "data/"
  corpus_path: "data/corpus/"
  train_path: "data/train.jsonl"
  val_path: "data/val.jsonl"
  test_path: "data/test.jsonl"
  use_embeddings_for_difficulty: true
  difficulty_levels: ["simple", "medium", "hard"]

# Model Configuration
model:
  generator:
    type: "huggingface"
    name: "microsoft/Phi-3.5-mini-instruct"  # 3.8B
    device: "cuda"
    max_tokens: 512
    temperature: 0.1
    torch_dtype: "float16"
    load_in_8bit: false
    load_in_4bit: false
  
  retriever:
    type: "dense"
    embedding_model: "all-MiniLM-L6-v2"
    top_k_initial: 1
    retrieval_embeddings_path: "data/embeddings/"

# Fixed RAG Configuration
fixed_rag:
  enabled: true
  retrieval_strategy: "fixed"
  fixed_retrieval_count: 1

# Evaluation Configuration
evaluation:
  checkpoint_path: null
  output_dir: "results/phi3.5-fixed-1/"
  max_samples: 10000
  num_val_samples: 500
  metrics: ["accuracy", "retrieval_count", "latency", "energy_estimate"]

# WandB Configuration
wandb:
  enabled: true
  project: "adaptive-rag-opensource"
  name: "phi3.5-fixed-1-baseline"
  tags: ["3.8b", "phi", "fixed-1", "baseline"]