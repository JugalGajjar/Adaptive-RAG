defaults:
  - _self_
  - override hydra/job_logging: default
  - override hydra/hydra_logging: default

experiment_name: "experiment-1"
model_size: "4B"
strategy: "adaptive"

# Data Configuration
data:
  data_path: "data/"
  corpus_path: "data/corpus/"
  train_path: "data/train.jsonl"
  val_path: "data/val.jsonl"
  test_path: "data/test.jsonl"
  use_embeddings_for_difficulty: true
  difficulty_levels: ["simple", "medium", "hard"]

# Model Configuration
model:
  generator:
    type: "huggingface"
    name: "Qwen/Qwen3-4B-Instruct-2507"  # 4B
    device: "cuda"
    max_tokens: 512
    temperature: 0.1
    torch_dtype: "float16"
    load_in_8bit: false
    load_in_4bit: false
  
  retriever:
    type: "dense"
    embedding_model: "all-MiniLM-L6-v2"
    top_k_initial: 3
    retrieval_embeddings_path: "data/embeddings/"
  
  policy_network:
    hidden_size: 256
    num_layers: 2
    dropout: 0.1
    use_attention: true

# Training Configuration
training:
  seed: 42
  batch_size: 32
  learning_rate: 1e-4
  gamma: 0.99
  tau: 0.005
  buffer_size: 50000
  warmup_steps: 2000
  
  total_episodes: 3000
  episodes_per_epoch: 10
  updates_per_epoch: 5
  eval_interval: 50
  checkpoint_interval: 250
  checkpoint_dir: "checkpoints/qwen3-4b-adaptive/"
  
  reward_weights:
    correctness: 5.0
    retrieval_penalty: -0.1
    latency_penalty: -0.01
    step_penalty: -0.05
    retrieval_quality: 2.0  # Reward good retrieval

# Environment Configuration
environment:
  max_retrieval_steps: 5
  confidence_threshold: 0.7
  max_query_reformulations: 2
  early_stopping_patience: 3
  retrieval_batch_size: 3

# Evaluation Configuration
evaluation:
  checkpoint_path: "checkpoints/best_model.pt"
  output_dir: "results/"
  max_samples: 1000
  num_val_samples: 100
  metrics: ["accuracy", "retrieval_count", "latency", "energy_estimate"]

# WandB Configuration (ADD THIS)
wandb:
  enabled: false
  project: "adaptive-rag"
  name: "experiment-1"